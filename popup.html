<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transformador de Texto</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        width: 350px;
        padding: 20px;
        background: white;
      }

      h1 {
        color: #667eea;
        margin-bottom: 5px;
        font-size: 1.5em;
      }

      .subtitle {
        color: #666;
        margin-bottom: 20px;
        font-size: 0.9em;
      }

      .status {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        text-align: center;
      }

      .toggle-btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1em;
        cursor: pointer;
        width: 100%;
        font-weight: 600;
        transition: background 0.3s;
      }

      .toggle-btn:hover {
        background: #5568d3;
      }

      .toggle-btn.active {
        background: #48bb78;
      }

      .toggle-btn.active:hover {
        background: #38a169;
      }

      .options-section {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
      }

      .options-section h3 {
        margin-bottom: 15px;
        color: #333;
        font-size: 1.1em;
      }

      .option {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        cursor: pointer;
      }

      .option input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-right: 10px;
        cursor: pointer;
      }

      .option span {
        color: #333;
        font-size: 0.95em;
      }

      .spacing-control {
        margin-top: 15px;
      }

      .spacing-control label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 0.95em;
      }

      .slider-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      input[type="range"] {
        flex: 1;
        cursor: pointer;
      }

      #spacingValue {
        font-weight: 600;
        color: #667eea;
        min-width: 20px;
        text-align: center;
      }

      .test-area {
        margin-top: 20px;
      }

      .test-area label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 0.95em;
      }

      .test-input {
        width: 100%;
        padding: 10px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 0.95em;
        font-family: inherit;
      }

      .test-input:focus {
        outline: none;
        border-color: #667eea;
      }

      .status-indicator {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #e53e3e;
        margin-right: 8px;
      }

      .status-indicator.active {
        background: #48bb78;
      }

      .status-text {
        font-weight: 600;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>Transformador de Texto</h1>
    <p class="subtitle">Estilo P I L O T A S</p>

    <div class="status">
      <div style="margin-bottom: 10px">
        <span class="status-indicator" id="statusIndicator"></span>
        <span class="status-text" id="statusText">Desactivado</span>
      </div>
      <button id="toggleBtn" class="toggle-btn">Activar Extensión</button>
    </div>

    <div class="options-section">
      <h3>Opciones de Transformación:</h3>

      <label class="option">
        <input type="checkbox" id="uppercase" checked />
        <span>Mayúsculas</span>
      </label>

      <label class="option">
        <input type="checkbox" id="lowercase" />
        <span>Minúsculas</span>
      </label>

      <label class="option">
        <input type="checkbox" id="addSpaces" checked />
        <span>Agregar espacios entre letras</span>
      </label>

      <div class="spacing-control">
        <label for="spacingAmount">Cantidad de espacios:</label>
        <div class="slider-container">
          <input type="range" id="spacingAmount" min="1" max="5" value="1" />
          <span id="spacingValue">1</span>
        </div>
      </div>
    </div>

    <div class="test-area">
      <label for="testInput">Prueba aquí:</label>
      <input
        type="text"
        id="testInput"
        class="test-input"
        placeholder="Escribe para probar..."
      />
    </div>

    <script src="popup.js"></script>
  </body>
</html>
